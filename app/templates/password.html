{% extends "base.html" %}
{% block content %}
<h4>Change Password</h4>
<div class="card" style="max-width:500px"><div class="card-body">
<form method="post">{{ form.hidden_tag() }}
{% for f in [form.current, form.new, form.confirm] %}
<div class="mb-3">{{ f.label(class="form-label") }} {{ f(class="form-control") }}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
{% endfor %}
<button class="btn mu-btn">Update Password</button>
</form></div></div>
{% endblock %}
